<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>场景资料图库 · Scene Reference Gallery</title>
<style>
  :root {
    --bg: #f6f5f1;
    --bg-card: #ffffff;
    --ink: #1f1d1a;
    --ink-soft: #5b5853;
    --ink-faint: #8e8a82;
    --line: #e7e3da;
    --accent: #c45a2c;
    --accent-soft: #f1d9c8;
    --shadow: 0 1px 2px rgba(28, 25, 20, 0.04), 0 6px 18px rgba(28, 25, 20, 0.06);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue",
                 "Segoe UI", "Noto Sans CJK SC", sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  header {
    padding: 56px 32px 28px;
    border-bottom: 1px solid var(--line);
    background: linear-gradient(180deg, #faf8f3 0%, var(--bg) 100%);
    position: sticky;
    top: 0;
    z-index: 50;
    backdrop-filter: blur(6px);
  }
  header.shrunk { padding: 16px 32px; }
  header.shrunk h1, header.shrunk .subtitle, header.shrunk .stats { display: none; }
  header .wrap { max-width: 1280px; margin: 0 auto; }
  h1 { font-size: 32px; font-weight: 600; margin: 0 0 6px; letter-spacing: -0.01em; }
  .subtitle { color: var(--ink-soft); font-size: 15px; margin: 0 0 22px; }
  .stats { display: flex; gap: 28px; flex-wrap: wrap; margin: 0 0 22px; }
  .stat { display: flex; align-items: baseline; gap: 8px; }
  .stat .num { font-size: 22px; font-weight: 600; color: var(--accent); }
  .stat .label { font-size: 13px; color: var(--ink-faint); }
  .toolbar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .search { flex: 1; min-width: 220px; max-width: 380px; position: relative; }
  .search input {
    width: 100%; padding: 10px 14px 10px 38px;
    border: 1px solid var(--line); border-radius: 999px;
    background: white; font-size: 14px; font-family: inherit;
    color: var(--ink); outline: none; transition: border-color 0.15s;
  }
  .search input:focus { border-color: var(--accent); }
  .search svg {
    position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
    color: var(--ink-faint);
  }
  .group-filters { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip {
    padding: 7px 14px; border: 1px solid var(--line); border-radius: 999px;
    background: white; font-size: 13px; color: var(--ink-soft);
    cursor: pointer; user-select: none; transition: all 0.15s;
  }
  .chip:hover { border-color: var(--accent); color: var(--accent); }
  .chip.active { background: var(--accent); color: white; border-color: var(--accent); }

  main { max-width: 1280px; margin: 0 auto; padding: 32px; }

  /* Level 1: group */
  .group { margin-bottom: 56px; scroll-margin-top: 100px; }
  .group-head {
    display: flex; align-items: baseline; gap: 12px;
    margin: 0 0 16px; padding-bottom: 12px; border-bottom: 2px solid var(--ink);
  }
  .group-icon { font-size: 24px; }
  .group-title { font-size: 22px; font-weight: 600; margin: 0; }
  .group-en { color: var(--ink-faint); font-size: 14px; font-style: italic; }
  .group-count { margin-left: auto; font-size: 13px; color: var(--ink-faint); }

  /* Level 2: category */
  .category {
    margin: 28px 0 36px; padding: 18px 22px 22px;
    background: var(--bg-card); border: 1px solid var(--line);
    border-radius: 10px; box-shadow: var(--shadow);
    scroll-margin-top: 100px;
  }
  .cat-head {
    display: flex; align-items: baseline; gap: 10px;
    flex-wrap: wrap; margin: 0 0 6px;
  }
  .cat-title { font-size: 19px; font-weight: 700; margin: 0; color: var(--ink); }
  .cat-en { color: var(--ink-faint); font-size: 13px; font-style: italic; }
  .cat-count {
    font-size: 12px; color: var(--ink); background: var(--accent-soft);
    padding: 2px 9px; border-radius: 999px;
  }
  .cat-meta { font-size: 12px; color: var(--ink-faint); }

  /* Level 3: location (within a category) */
  .location {
    margin: 18px 0 0;
    padding: 14px 0 4px;
    border-top: 1px dashed var(--line);
    scroll-margin-top: 100px;
  }
  .location:first-of-type { border-top: none; padding-top: 6px; }
  .loc-head {
    display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap;
    margin: 0 0 10px;
  }
  .loc-title {
    font-size: 15px; font-weight: 600; margin: 0;
    color: var(--accent);
  }
  .loc-en { color: var(--ink-faint); font-size: 12.5px; }
  .loc-count {
    font-size: 11px; color: var(--ink-soft); background: #f3efe7;
    padding: 1px 8px; border-radius: 999px;
  }
  .loc-multi {
    font-size: 11px; color: var(--accent); border: 1px solid var(--accent-soft);
    padding: 1px 7px; border-radius: 999px; background: #fff8f2;
  }

  /* Level 4: instance (#1 / #2 within a location) */
  .instance { margin: 6px 0 14px; padding-left: 14px; border-left: 3px solid var(--accent-soft); }
  .instance.no-label { border-left: none; padding-left: 0; }
  .inst-head {
    display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap;
    margin: 0 0 6px;
  }
  .inst-label {
    font-size: 12.5px; font-weight: 700; color: var(--accent);
    background: #fff; border: 1px solid var(--accent-soft);
    padding: 1px 8px; border-radius: 4px;
  }
  .inst-num { font-size: 11px; color: var(--ink-faint); }
  .inst-desc {
    font-size: 12.5px; color: var(--ink-soft); margin: 0 0 8px;
    line-height: 1.55; max-width: 880px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 10px;
  }
  .tile {
    background: var(--bg-card); border: 1px solid var(--line);
    border-radius: 6px; overflow: hidden; cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s, border-color 0.15s;
    position: relative;
  }
  .tile:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(28, 25, 20, 0.08), 0 12px 32px rgba(28, 25, 20, 0.1);
    border-color: var(--accent);
  }
  .tile img {
    display: block; width: 100%; aspect-ratio: 4 / 3;
    object-fit: cover; background: #eeebe3;
  }
  .tile .meta {
    padding: 6px 8px; font-size: 10.5px; color: var(--ink-faint);
    border-top: 1px solid var(--line); text-align: center;
  }
  .empty { text-align: center; padding: 60px 20px; color: var(--ink-faint); font-size: 14px; }

  /* Lightbox */
  .lightbox {
    position: fixed; inset: 0; background: rgba(15, 13, 10, 0.92);
    display: none; align-items: center; justify-content: center;
    z-index: 999; padding: 24px;
  }
  .lightbox.active { display: flex; }
  .lb-inner {
    max-width: 90vw; max-height: 92vh; display: flex;
    flex-direction: column; gap: 12px; align-items: center;
  }
  .lb-img {
    max-width: 90vw; max-height: 75vh; object-fit: contain;
    background: #111; border-radius: 4px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
  }
  .lb-caption { color: #f0ece4; font-size: 14px; max-width: 80vw; text-align: center; line-height: 1.5; }
  .lb-meta { color: #a09c93; font-size: 12px; }
  .lb-close, .lb-prev, .lb-next {
    position: absolute; background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.15);
    color: white; width: 44px; height: 44px; border-radius: 50%;
    cursor: pointer; font-size: 20px;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.15s;
  }
  .lb-close:hover, .lb-prev:hover, .lb-next:hover { background: rgba(255, 255, 255, 0.18); }
  .lb-close { top: 24px; right: 24px; }
  .lb-prev { left: 24px; top: 50%; transform: translateY(-50%); }
  .lb-next { right: 24px; top: 50%; transform: translateY(-50%); }

  /* Index drawer */
  .toc {
    margin: 18px 0 0; background: white; border: 1px solid var(--line);
    border-radius: 8px; padding: 12px 16px; font-size: 13px;
  }
  .toc summary {
    cursor: pointer; font-weight: 600; color: var(--ink-soft);
    list-style: none; display: flex; align-items: center; gap: 8px;
  }
  .toc summary::-webkit-details-marker { display: none; }
  .toc summary::before { content: "▸"; transition: transform 0.15s; color: var(--ink-faint); }
  .toc[open] summary::before { transform: rotate(90deg); }
  .toc-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 6px 18px; margin-top: 12px;
  }
  .toc a {
    color: var(--ink-soft); text-decoration: none;
    padding: 4px 0; font-size: 12.5px;
    border-bottom: 1px solid transparent; transition: color 0.15s;
  }
  .toc a:hover { color: var(--accent); }

  @media (max-width: 720px) {
    header { padding: 32px 18px 20px; position: static; }
    main { padding: 20px 18px; }
    h1 { font-size: 26px; }
    .grid { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 6px; }
    .category { padding: 14px 14px 18px; }
    .instance { padding-left: 10px; }
  }
</style>
</head>

<header id="header">
  <div class="wrap">
    <h1>场景资料图库</h1>
    <p class="subtitle">Scene Reference Gallery — 大类 ▸ 场景 ▸ 地点 ▸（同名地点用 #1/#2 区分）</p>

<main id="main"></main>

    <div class="lb-caption" id="lb-caption"></div>
    <div class="lb-meta" id="lb-meta"></div>
  </div>
</div>

let flatImages = [];

function escapeHtml(s) {
  return (s || '').replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  })[c]);
}
function slug(s){ return (s||'').replace(/[^a-zA-Z0-9_-]+/g,'_'); }

function locImageCount(loc) {
  return loc.instances.reduce((s,i)=>s+i.images.length, 0);
}

function render(filter) {
  const main = document.getElementById('main');
  main.innerHTML = '';
  flatImages = [];
  const q = (filter.q || '').trim().toLowerCase();
  let totalShown = 0;

  for (const [groupKey, group] of Object.entries(DATA.groups)) {
    if (filter.group !== 'all' && filter.group !== groupKey) continue;
    const cats = group.items.map(k => DATA.categories[k]).filter(Boolean);

    let groupVisibleImages = 0;
    let catSections = [];

    for (const cat of cats) {
      let locSections = [];
      let catVisible = 0;
      let visibleLocs = 0;
      let visibleInstances = 0;

      for (const loc of cat.locations) {
        // Filter instances inside this location
        const visibleInsts = loc.instances.filter(inst => {
          if (!q) return true;
          return (
            loc.title.toLowerCase().includes(q) ||
            (loc.title_en || '').toLowerCase().includes(q) ||
            (inst.desc || '').toLowerCase().includes(q) ||
            cat.name_zh.toLowerCase().includes(q) ||
            cat.name_en.toLowerCase().includes(q) ||
            inst.images.some(im => (im.filename||'').toLowerCase().includes(q))
          );
        });
        if (visibleInsts.length === 0) continue;

        const locImgs = visibleInsts.reduce((s,i)=>s+i.images.length, 0);
        catVisible += locImgs;
        visibleLocs += 1;
        visibleInstances += visibleInsts.length;

        const multiInst = loc.instances.length > 1;

        const instHtml = visibleInsts.map(inst => {
          const labelHtml = inst.label
            ? `<span class="inst-label">${escapeHtml(inst.label)}</span>`
            : '';
          const tilesHtml = inst.images.map(im => {
            const fi = flatImages.length;
            flatImages.push({
              ...im,
              catName: cat.name_zh,
              catEn: cat.name_en,
              locName: loc.title,
              locEn: loc.title_en || '',
              instLabel: inst.label,
              instDesc: inst.desc || ''
            });
            return `<div class="tile" data-idx="${fi}">
              <img loading="lazy" src="${escapeHtml(im.thumb || im.src)}" alt="">
              <div class="meta">${escapeHtml(im.filename)}</div>
            </div>`;
          }).join('');
          return `
            <div class="instance ${inst.label ? '' : 'no-label'}">
              ${inst.label ? `<div class="inst-head">${labelHtml}<span class="inst-num">${inst.images.length} 张</span></div>` : ''}
              ${inst.desc ? `<p class="inst-desc">${escapeHtml(inst.desc)}</p>` : ''}
              <div class="grid">${tilesHtml}</div>
            </div>
          `;
        }).join('');

        locSections.push(`
          <section class="location" id="loc-${slug(cat.key)}-${slug(loc.title)}">
            <div class="loc-head">
              <h4 class="loc-title">${escapeHtml(loc.title)}</h4>
              ${loc.title_en ? `<span class="loc-en">${escapeHtml(loc.title_en)}</span>` : ''}
              <span class="loc-count">${locImgs} 张</span>
              ${multiInst ? `<span class="loc-multi">同名地点 ${loc.instances.length} 处</span>` : ''}
            </div>
            ${instHtml}
          </section>
        `);
      }

      if (locSections.length === 0) continue;

      groupVisibleImages += catVisible;
      catSections.push(`
        <section class="category" id="cat-${cat.key}">
          <div class="cat-head">
            <h3 class="cat-title">${escapeHtml(cat.name_zh)}</h3>
            <span class="cat-en">${escapeHtml(cat.name_en)}</span>
            <span class="cat-count">${catVisible} 张</span>
            <span class="cat-meta">· ${visibleLocs} 个地点 / ${visibleInstances} 处具体地点</span>
          </div>
          ${locSections.join('')}
        </section>
      `);
    }

    if (catSections.length === 0) continue;
    totalShown += groupVisibleImages;

    main.insertAdjacentHTML('beforeend', `
      <section class="group" id="group-${groupKey}">
        <div class="group-head">
          <span class="group-icon">${group.icon}</span>
          <h2 class="group-title">${escapeHtml(group.title_zh)}</h2>
          <span class="group-en">${escapeHtml(group.title_en)}</span>
          <span class="group-count">${groupVisibleImages} 张</span>
        </div>
        ${catSections.join('')}
      </section>
    `);
  }

  if (totalShown === 0) {
    main.innerHTML = `<div class="empty">没有匹配的图片 · No images matched.</div>`;
  }

  document.querySelectorAll('.tile').forEach(t => {
    t.addEventListener('click', () => openLightbox(parseInt(t.dataset.idx)));
  });
}

function buildHeader() {
  let imgTotal = 0, locTotal = 0, instTotal = 0;
  for (const c of Object.values(DATA.categories)) {
    imgTotal += c.image_count;
    locTotal += c.locations.length;
    instTotal += c.instance_count;
  }
  const catTotal = Object.keys(DATA.categories).length;
  const groupTotal = Object.keys(DATA.groups).length;
  document.getElementById('stats').innerHTML = `
    <div class="stat"><span class="num">${imgTotal}</span><span class="label">张图 Images</span></div>
    <div class="stat"><span class="num">${locTotal}</span><span class="label">地点 Locations</span></div>
    <div class="stat"><span class="num">${instTotal}</span><span class="label">具体地点 Instances</span></div>
    <div class="stat"><span class="num">${catTotal}</span><span class="label">场景 Scenes</span></div>
    <div class="stat"><span class="num">${groupTotal}</span><span class="label">大类 Groups</span></div>
  `;

  const gf = document.getElementById('group-filters');
  let chips = `<div class="chip active" data-group="all">全部 All</div>`;
  for (const [k, g] of Object.entries(DATA.groups)) {
    chips += `<div class="chip" data-group="${k}">${g.icon} ${escapeHtml(g.title_zh)}</div>`;
  }
  gf.innerHTML = chips;
  gf.querySelectorAll('.chip').forEach(c => {
    c.addEventListener('click', () => {
      gf.querySelectorAll('.chip').forEach(x => x.classList.remove('active'));
      c.classList.add('active');
      currentFilter.group = c.dataset.group;
      render(currentFilter);
    });
  });

  // TOC: list every location
  const tocGrid = document.getElementById('toc-grid');
  const links = [];
  for (const [groupKey, group] of Object.entries(DATA.groups)) {
    links.push(`<a href="#group-${groupKey}" style="grid-column: 1 / -1; font-weight:600; color:var(--ink); margin-top:6px;">${group.icon} ${escapeHtml(group.title_zh)}</a>`);
    for (const k of group.items) {
      const cat = DATA.categories[k];
      if (!cat) continue;
      for (const loc of cat.locations) {
        const n = locImageCount(loc);
        const tag = loc.instances.length > 1 ? ` ×${loc.instances.length}` : '';
        links.push(`<a href="#loc-${slug(cat.key)}-${slug(loc.title)}">· ${escapeHtml(cat.name_zh)} / ${escapeHtml(loc.title)}${tag} <span style="color:var(--ink-faint);">(${n})</span></a>`);
      }
    }
  }
  tocGrid.innerHTML = links.join('');
}

const currentFilter = { q: '', group: 'all' };

document.getElementById('search').addEventListener('input', e => {
  currentFilter.q = e.target.value;
  render(currentFilter);
});

// Lightbox
const lb = document.getElementById('lightbox');
const lbImg = document.getElementById('lb-img');
const lbCaption = document.getElementById('lb-caption');
const lbMeta = document.getElementById('lb-meta');
let lbIdx = 0;

function openLightbox(idx) {
  lbIdx = idx;
  showLightboxImage();
  lb.classList.add('active');
  document.body.style.overflow = 'hidden';
}
function showLightboxImage() {
  const im = flatImages[lbIdx];
  if (!im) return;
  lbImg.src = im.src;
  lbImg.alt = im.filename;
  lbCaption.textContent = im.instDesc || '';
  const labelPart = im.instLabel ? ` ${im.instLabel}` : '';
  lbMeta.textContent = `${im.catName} › ${im.locName}${labelPart}${im.locEn ? ' (' + im.locEn + ')' : ''} · ${im.filename} · ${lbIdx + 1} / ${flatImages.length}`;
}
function closeLightbox() {
  lb.classList.remove('active');
  document.body.style.overflow = '';
}
document.getElementById('lb-close').addEventListener('click', closeLightbox);
document.getElementById('lb-prev').addEventListener('click', () => {
  lbIdx = (lbIdx - 1 + flatImages.length) % flatImages.length;
  showLightboxImage();
});
document.getElementById('lb-next').addEventListener('click', () => {
  lbIdx = (lbIdx + 1) % flatImages.length;
  showLightboxImage();
});
lb.addEventListener('click', e => { if (e.target === lb) closeLightbox(); });
document.addEventListener('keydown', e => {
  if (!lb.classList.contains('active')) return;
  if (e.key === 'Escape') closeLightbox();
  if (e.key === 'ArrowLeft') document.getElementById('lb-prev').click();
  if (e.key === 'ArrowRight') document.getElementById('lb-next').click();
});

// Sticky header shrink on scroll
window.addEventListener('scroll', () => {
  const h = document.getElementById('header');
  if (window.scrollY > 200) h.classList.add('shrunk'); else h.classList.remove('shrunk');
});

buildHeader();
render(currentFilter);
</script>
</body>
</html>
