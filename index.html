<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>场景资料图库 · Scene Reference Gallery with Upload</title>
<style>
  :root { --bg: #f6f5f1; --bg-card: #ffffff; --ink: #1f1d1a; --ink-soft: #5b5853; --ink-faint: #8e8a82; --line: #e7e3da; --accent: #c45a2c; --accent-soft: #f1d9c8; --shadow: 0 1px 2px rgba(28,25,20,0.04), 0 6px 18px rgba(28,25,20,0.06); }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); line-height: 1.5; -webkit-font-smoothing: antialiased; }
  header { padding: 56px 32px 28px; border-bottom: 1px solid var(--line); background: linear-gradient(180deg, #faf8f3 0%, var(--bg) 100%); position: sticky; top: 0; z-index: 50; backdrop-filter: blur(6px); }
  header.shrunk { padding: 16px 32px; }
  header.shrunk h1, header.shrunk .subtitle { display: none; }
  h1 { font-size: 32px; font-weight: 600; margin: 0 0 6px; }
  .subtitle { color: var(--ink-soft); font-size: 15px; margin: 0 0 22px; }
  .stats { display: flex; gap: 28px; flex-wrap: wrap; margin: 0 0 22px; }
  .stat { display: flex; align-items: baseline; gap: 8px; }
  .stat .num { font-size: 22px; font-weight: 600; color: var(--accent); }
  .toolbar { display: flex; gap: 12px; align-items: center; }
  .search { flex: 1; min-width: 200px; position: relative; }
  .search input { width: 100%; padding: 10px 14px 10px 38px; border: 1px solid var(--line); border-radius: 999px; background: white; font-size: 14px; font-family: inherit; color: var(--ink); outline: none; }
  .search input:focus { border-color: var(--accent); }
  main { max-width: 1280px; margin: 0 auto; padding: 32px; }
  .group { margin-bottom: 56px; }
  .group-head { display: flex; align-items: baseline; gap: 12px; margin: 0 0 16px; padding-bottom: 12px; border-bottom: 2px solid var(--ink); }
  .group-title { font-size: 22px; font-weight: 600; margin: 0; }
  .category { margin: 28px 0 36px; padding: 18px 22px 22px; background: var(--bg-card); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); }
  .cat-title { font-size: 19px; font-weight: 700; margin: 0 0 6px; }
  .cat-count { font-size: 12px; background: var(--accent-soft); padding: 2px 9px; border-radius: 999px; }
  .location { margin: 18px 0 0; padding: 14px 0 4px; border-top: 1px dashed var(--line); }
  .loc-title { font-size: 15px; font-weight: 600; margin: 0; color: var(--accent); }
  .loc-count { font-size: 11px; background: #f3efe7; padding: 1px 8px; border-radius: 999px; }
  .instance { margin: 6px 0 14px; padding-left: 14px; border-left: 3px solid var(--accent-soft); }
  .inst-label { font-size: 12px; font-weight: 700; color: var(--accent); background: white; border: 1px solid var(--accent-soft); padding: 1px 8px; border-radius: 4px; }
  .inst-desc { font-size: 12px; color: var(--ink-soft); margin: 0 0 8px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; }
  .tile { background: var(--bg-card); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; cursor: pointer; transition: all 0.15s; }
  .tile:hover { transform: translateY(-2px); border-color: var(--accent); box-shadow: 0 4px 12px rgba(28,25,20,0.08); }
  .tile img { display: block; width: 100%; aspect-ratio: 4/3; object-fit: cover; background: #eeebe3; }
  .tile .meta { padding: 6px 8px; font-size: 10px; color: var(--ink-faint); border-top: 1px solid var(--line); text-align: center; }
  .empty { text-align: center; padding: 60px 20px; color: var(--ink-faint); }
  .lightbox { position: fixed; inset: 0; background: rgba(15,13,10,0.92); display: none; align-items: center; justify-content: center; z-index: 999; }
  .lightbox.active { display: flex; }
  .lb-img { max-width: 90vw; max-height: 75vh; object-fit: contain; }
  .lb-caption { color: #f0ece4; font-size: 14px; max-width: 80vw; text-align: center; margin-top: 12px; }
  .lb-close, .lb-prev, .lb-next { position: absolute; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: white; width: 44px; height: 44px; border-radius: 50%; cursor: pointer; font-size: 20px; display: flex; align-items: center; justify-content: center; }
  .lb-close { top: 24px; right: 24px; }
  .lb-prev { left: 24px; top: 50%; transform: translateY(-50%); }
  .lb-next { right: 24px; top: 50%; transform: translateY(-50%); }
  
  /* Upload Panel */
  .upload-panel { position: fixed; right: 0; top: 0; width: 380px; height: 100vh; background: white; border-left: 1px solid var(--line); z-index: 40; transform: translateX(100%); transition: transform 0.3s; display: flex; flex-direction: column; box-shadow: -2px 0 12px rgba(0,0,0,0.1); }
  .upload-panel.active { transform: translateX(0); }
  .upload-panel header { padding: 16px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; }
  .upload-panel h2 { margin: 0; font-size: 16px; }
  .upload-panel-close { background: none; border: none; cursor: pointer; font-size: 24px; }
  .upload-panel-content { flex: 1; padding: 16px; overflow-y: auto; }
  .form-group { margin-bottom: 16px; }
  .form-group label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 13px; }
  .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 8px; border: 1px solid var(--line); border-radius: 4px; font-family: inherit; font-size: 13px; }
  .form-group textarea { min-height: 60px; resize: vertical; }
  .btn { padding: 10px 16px; border: none; border-radius: 4px; cursor: pointer; font-weight: 600; font-size: 13px; }
  .btn-primary { background: var(--accent); color: white; width: 100%; }
  .btn-secondary { background: var(--accent-soft); color: var(--accent); border: 1px solid var(--accent); width: 100%; }
  .upload-toggle { position: fixed; right: 24px; bottom: 24px; width: 56px; height: 56px; background: var(--accent); border: none; border-radius: 50%; color: white; font-size: 24px; cursor: pointer; box-shadow: var(--shadow); z-index: 30; }
  .upload-toggle:hover { transform: scale(1.1); }
  .success-msg { padding: 8px 12px; background: #d4edda; color: #155724; border-radius: 3px; margin-bottom: 12px; font-size: 12px; }
  .error-msg { padding: 8px 12px; background: #f8d7da; color: #721c24; border-radius: 3px; margin-bottom: 12px; font-size: 12px; }

  @media (max-width: 720px) {
    header { padding: 32px 18px 20px; }
    main { padding: 20px 18px; }
    .upload-panel { width: 100%; }
  }
</style>
</head>
<body>

<header id="header">
  <h1>场景资料图库</h1>
  <p class="subtitle">Scene Reference Gallery — 支持图片上传 · Image Upload Feature</p>
  <div class="stats" id="stats"></div>
  <div class="toolbar">
    <div class="search">
      <input id="search" type="text" placeholder="搜索...">
    </div>
  </div>
</header>

<main id="main"></main>

<div class="lightbox" id="lightbox">
  <button class="lb-close" id="lb-close">×</button>
  <button class="lb-prev" id="lb-prev">‹</button>
  <button class="lb-next" id="lb-next">›</button>
  <div style="text-align:center;">
    <img class="lb-img" id="lb-img" alt="">
    <div class="lb-caption" id="lb-caption"></div>
  </div>
</div>

<button class="upload-toggle" id="upload-toggle">+</button>
<div class="upload-panel" id="upload-panel">
  <header>
    <h2>上传图片</h2>
    <button class="upload-panel-close" id="upload-panel-close">×</button>
  </header>
  <div class="upload-panel-content">
    <div id="upload-message"></div>
    
    <div class="form-group">
      <label>大类 · Group</label>
      <select id="upload-group" required></select>
    </div>

    <div class="form-group">
      <label>场景 · Scene</label>
      <select id="upload-category" required></select>
    </div>

    <div class="form-group">
      <label>地点名称 · Location</label>
      <input type="text" id="upload-location" placeholder="例：高美古路">
    </div>

    <div class="form-group">
      <label>选项标签 · Label</label>
      <input type="text" id="upload-label" placeholder="例：#1">
    </div>

    <div class="form-group">
      <label>描述 · Description</label>
      <textarea id="upload-desc" placeholder="路程、交通等..."></textarea>
    </div>

    <div class="form-group">
      <label>选择图片 · Images</label>
      <input type="file" id="upload-files" multiple accept="image/*">
    </div>

    <div id="preview"></div>

    <button class="btn btn-primary" id="upload-btn">上传 Upload</button>
    <button class="btn btn-secondary" id="clear-btn" style="margin-top:8px;">清除 Clear</button>

    <hr style="margin:16px 0;border:none;border-top:1px solid var(--line);">
    <button class="btn btn-secondary" id="export-btn" style="margin-bottom:6px;">导出 Export</button>
    <button class="btn btn-secondary" id="import-btn" style="margin-bottom:6px;">导入 Import</button>
    <button class="btn btn-secondary" id="reset-btn" style="background:#ffebee;color:#c45a2c;border-color:#ffcdd2;">重置 Reset</button>
  </div>
</div>

<script>
let DATA = {groups:{outdoor_road:{title_zh:"道路",title_en:"Roads",icon:"🛣️",items:["test_road"]},public:{title_zh:"公共",title_en:"Public",icon:"🏫",items:["test_public"]}},categories:{test_road:{key:"test_road",name_zh:"测试道路",name_en:"Test Road",image_count:0,locations:[],instance_count:0},test_public:{key:"test_public",name_zh:"测试公共",name_en:"Test Public",image_count:0,locations:[],instance_count:0}}};
let ORIGINAL_DATA = JSON.parse(JSON.stringify(DATA));
let uploadedImages = {};
let flatImages = [];
let currentFilter = {q:'',group:'all'};
const USER_DATA_KEY = 'dlag_upload_data';

function escapeHtml(s){return (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function slug(s){return (s||'').replace(/[^a-zA-Z0-9_-]+/g,'_');}
function loadUserData(){const stored=localStorage.getItem(USER_DATA_KEY);if(stored){try{const userData=JSON.parse(stored);if(userData.categories)Object.assign(DATA.categories,userData.categories);if(userData.images)uploadedImages=userData.images;}catch(e){console.error(e);}}}
function saveUserData(){const userData={categories:{},images:uploadedImages};for(const [key,cat] of Object.entries(DATA.categories)){if(!ORIGINAL_DATA.categories[key])userData.categories[key]=cat;}localStorage.setItem(USER_DATA_KEY,JSON.stringify(userData));}

function render(filter){
  const main=document.getElementById('main');main.innerHTML='';flatImages=[];
  const q=(filter.q||'').trim().toLowerCase();let totalShown=0;
  for(const [groupKey,group] of Object.entries(DATA.groups)){
    if(filter.group!=='all'&&filter.group!==groupKey)continue;
    const cats=group.items.map(k=>DATA.categories[k]).filter(Boolean);
    let groupVisibleImages=0,catSections=[];
    for(const cat of cats){
      let locSections=[],catVisible=0,visibleLocs=0;
      for(const loc of cat.locations){
        const visibleInsts=loc.instances.filter(inst=>{
          if(!q)return true;
          return loc.title.toLowerCase().includes(q)||(inst.desc||'').toLowerCase().includes(q);
        });
        if(visibleInsts.length===0)continue;
        const locImgs=visibleInsts.reduce((s,i)=>s+i.images.length,0);
        catVisible+=locImgs;visibleLocs+=1;
        const instHtml=visibleInsts.map(inst=>{
          const labelHtml=inst.label?`<span class="inst-label">${escapeHtml(inst.label)}</span>`:'';
          const tilesHtml=inst.images.map(im=>{
            const fi=flatImages.length;
            flatImages.push({...im,catName:cat.name_zh,locName:loc.title,instLabel:inst.label,instDesc:inst.desc||''});
            const thumb=im.isUserUpload&&uploadedImages[im.src]?uploadedImages[im.src].data:(im.thumb||im.src);
            return `<div class="tile" data-idx="${fi}"><img loading="lazy" src="${thumb}" alt=""><div class="meta">${escapeHtml(im.filename)}</div></div>`;
          }).join('');
          return `<div class="instance">${inst.label?`<div>${labelHtml}</div>`:''}${inst.desc?`<p class="inst-desc">${escapeHtml(inst.desc)}</p>`:''}<div class="grid">${tilesHtml}</div></div>`;
        }).join('');
        locSections.push(`<section class="location"><div class="loc-title">${escapeHtml(loc.title)} <span class="loc-count">${locImgs}</span></div>${instHtml}</section>`);
      }
      if(locSections.length===0)continue;
      groupVisibleImages+=catVisible;
      catSections.push(`<section class="category"><div class="cat-title">${escapeHtml(cat.name_zh)} <span class="cat-count">${catVisible}</span></div>${locSections.join('')}</section>`);
    }
    if(catSections.length===0)continue;
    totalShown+=groupVisibleImages;
    main.insertAdjacentHTML('beforeend',`<section class="group"><div class="group-head"><span>${group.icon}</span><h2 class="group-title">${escapeHtml(group.title_zh)}</h2></div>${catSections.join('')}</section>`);
  }
  if(totalShown===0)main.innerHTML=`<div class="empty">还没有图片 No images yet</div>`;
  document.querySelectorAll('.tile').forEach(t=>t.addEventListener('click',()=>openLightbox(parseInt(t.dataset.idx))));
}

function buildHeader(){
  let imgTotal=0;
  for(const c of Object.values(DATA.categories))imgTotal+=c.image_count;
  document.getElementById('stats').innerHTML=`<div class="stat"><span class="num">${imgTotal}</span><span>图片 Images</span></div>`;
}

const lb=document.getElementById('lightbox');
const lbImg=document.getElementById('lb-img');
const lbCaption=document.getElementById('lb-caption');
let lbIdx=0;

function openLightbox(idx){
  lbIdx=idx;
  const im=flatImages[lbIdx];
  if(im.isUserUpload&&uploadedImages[im.src])lbImg.src=uploadedImages[im.src].data;
  else lbImg.src=im.src;
  lbCaption.textContent=uploadedImages[im.src]?.desc||im.instDesc||'';
  lb.classList.add('active');
  document.body.style.overflow='hidden';
}

function closeLightbox(){lb.classList.remove('active');document.body.style.overflow='';}

document.getElementById('lb-close').addEventListener('click',closeLightbox);
document.getElementById('lb-prev').addEventListener('click',()=>{
  lbIdx=(lbIdx-1+flatImages.length)%flatImages.length;
  const im=flatImages[lbIdx];
  lbImg.src=im.isUserUpload&&uploadedImages[im.src]?uploadedImages[im.src].data:im.src;
  lbCaption.textContent=uploadedImages[im.src]?.desc||im.instDesc||'';
});
document.getElementById('lb-next').addEventListener('click',()=>{
  lbIdx=(lbIdx+1)%flatImages.length;
  const im=flatImages[lbIdx];
  lbImg.src=im.isUserUpload&&uploadedImages[im.src]?uploadedImages[im.src].data:im.src;
  lbCaption.textContent=uploadedImages[im.src]?.desc||im.instDesc||'';
});

document.getElementById('search').addEventListener('input',e=>{currentFilter.q=e.target.value;render(currentFilter);});

// Upload Panel
const toggle=document.getElementById('upload-toggle');
const panel=document.getElementById('upload-panel');
const close=document.getElementById('upload-panel-close');
const groupSel=document.getElementById('upload-group');
const catSel=document.getElementById('upload-category');
const files=document.getElementById('upload-files');
const preview=document.getElementById('preview');

toggle.addEventListener('click',()=>panel.classList.add('active'));
close.addEventListener('click',()=>panel.classList.remove('active'));

for(const [key,group] of Object.entries(DATA.groups)){
  const opt=document.createElement('option');
  opt.value=key;opt.textContent=`${group.icon} ${group.title_zh}`;
  groupSel.appendChild(opt);
}

groupSel.addEventListener('change',(e)=>{
  catSel.innerHTML='<option>选择场景</option>';
  if(e.target.value&&DATA.groups[e.target.value]){
    DATA.groups[e.target.value].items.forEach(k=>{
      const cat=DATA.categories[k];
      if(cat){
        const opt=document.createElement('option');
        opt.value=k;opt.textContent=cat.name_zh;
        catSel.appendChild(opt);
      }
    });
  }
});

files.addEventListener('change',()=>{
  preview.innerHTML='';
  Array.from(files.files).forEach(f=>{
    const r=new FileReader();
    r.onload=(e)=>{
      const div=document.createElement('div');
      div.style.cssText='margin:12px 0;padding:8px;background:#f5f5f5;border-radius:4px;';
      div.innerHTML=`<img src="${e.target.result}" style="width:100%;height:80px;object-fit:cover;border-radius:3px;margin-bottom:6px;"><textarea class="img-desc" placeholder="说明..." style="width:100%;min-height:50px;padding:6px;border:1px solid var(--line);border-radius:3px;font-family:inherit;font-size:12px;"></textarea>`;
      preview.appendChild(div);
    };
    r.readAsDataURL(f);
  });
});

document.getElementById('upload-btn').addEventListener('click',()=>{
  const group=groupSel.value;
  const cat=catSel.value;
  const loc=document.getElementById('upload-location').value.trim();
  const label=document.getElementById('upload-label').value.trim();
  const desc=document.getElementById('upload-desc').value.trim();
  const flist=Array.from(files.files);

  if(!group||!cat||!loc||!flist.length){
    document.getElementById('upload-message').className='error-msg';
    document.getElementById('upload-message').textContent='请填写必填项并选择图片';
    return;
  }

  const descs=Array.from(document.querySelectorAll('.img-desc')).map(e=>e.value.trim());
  const category=DATA.categories[cat];
  let location=category.locations.find(l=>l.title===loc);

  if(!location){
    location={title:loc,instances:[]};
    category.locations.push(location);
  }

  let inst=location.instances.find(i=>i.label===label);
  if(!inst){
    inst={label,seq:null,desc,images:[]};
    location.instances.push(inst);
  }

  flist.forEach((f,i)=>{
    const r=new FileReader();
    r.onload=(e)=>{
      const id=`user_${Date.now()}_${Math.random().toString(36).substr(2,9)}`;
      uploadedImages[id]={data:e.target.result,desc:descs[i]};
      inst.images.push({src:id,filename:f.name,isUserUpload:true});
      category.image_count++;
    };
    r.readAsDataURL(f);
  });

  setTimeout(()=>{
    saveUserData();
    document.getElementById('upload-message').className='success-msg';
    document.getElementById('upload-message').textContent='上传成功！ Upload successful!';
    files.value='';preview.innerHTML='';
    render(currentFilter);buildHeader();
  },500);
});

document.getElementById('clear-btn').addEventListener('click',()=>{
  groupSel.value='';catSel.value='';
  document.getElementById('upload-location').value='';
  document.getElementById('upload-label').value='';
  document.getElementById('upload-desc').value='';
  files.value='';preview.innerHTML='';
  document.getElementById('upload-message').innerHTML='';
});

document.getElementById('export-btn').addEventListener('click',()=>{
  const userData={categories:{},images:uploadedImages};
  for(const [k,c] of Object.entries(DATA.categories)){
    if(!ORIGINAL_DATA.categories[k])userData.categories[k]=c;
  }
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(userData)],{type:'application/json'}));
  a.download='dlag_data.json';a.click();
});

document.getElementById('import-btn').addEventListener('click',()=>{
  const input=document.createElement('input');
  input.type='file';input.accept='.json';
  input.addEventListener('change',(e)=>{
    const f=e.target.files[0];if(!f)return;
    const r=new FileReader();
    r.onload=(ev)=>{
      try{
        const data=JSON.parse(ev.target.result);
        if(data.categories)Object.assign(DATA.categories,data.categories);
        if(data.images)Object.assign(uploadedImages,data.images);
        saveUserData();render(currentFilter);buildHeader();
        document.getElementById('upload-message').className='success-msg';
        document.getElementById('upload-message').textContent='导入成功！Import successful!';
      }catch(err){
        document.getElementById('upload-message').className='error-msg';
        document.getElementById('upload-message').textContent='导入失败：'+err.message;
      }
    };
    r.readAsText(f);
  });
  input.click();
});

document.getElementById('reset-btn').addEventListener('click',()=>{
  if(confirm('确定要重置所有数据吗？')){
    localStorage.removeItem(USER_DATA_KEY);
    DATA=JSON.parse(JSON.stringify(ORIGINAL_DATA));
    uploadedImages={};
    render(currentFilter);buildHeader();
    document.getElementById('upload-message').className='success-msg';
    document.getElementById('upload-message').textContent='已重置';
  }
});

loadUserData();
buildHeader();
render(currentFilter);
window.addEventListener('scroll',()=>{document.getElementById('header').classList.toggle('shrunk',window.scrollY>200);});
</script>
</body>
</html>
